options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    dnssec-validation no;
    minimal-responses yes;
};

zone "ps033.test" IN {
    type primary;
    file "/etc/bind/ps033.test.signed";
    allow-update { none; };
};
