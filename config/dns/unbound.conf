server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    access-control: 0.0.0.0/0 allow
    hide-identity: yes
    hide-version: yes
    harden-dnssec-stripped: yes
    qname-minimisation: yes
    prefetch: yes
    trust-anchor-file: "/opt/unbound/ps033-trust-anchor.key"

forward-zone:
    name: "ps033.test."
    forward-addr: bind9@53
